name: Build and release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-and-release.yml"

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        run: |
          set -euo pipefail
          VERSION_CODE=$((2000000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="webview-${GITHUB_RUN_NUMBER}"
          TAG="webview-${GITHUB_RUN_NUMBER}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > release.jks

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Build unsigned release APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ANDROID_KEY_ALIAS}"
          test -n "${ANDROID_KEY_PASSWORD}"

          BUILD_TOOLS_DIR=$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          TAG="${{ steps.version.outputs.tag }}"

          mkdir -p dist
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*unsigned*.apk" -print -quit)
          ALIGNED_APK="dist/opencode-android-${TAG}-aligned.apk"
          SIGNED_APK="dist/opencode-android-${TAG}.apk"

          "${ZIPALIGN}" -p -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${APKSIGNER}" sign \
            --ks release.jks \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"
          "${APKSIGNER}" verify --verbose "${SIGNED_APK}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenCode Android WebView ${{ steps.version.outputs.version_name }}
          body: |
            Personal WebView wrapper for OpenCode Web.

            Start your server with:

            ```bash
            OPENCODE_SERVER_USERNAME=armin OPENCODE_SERVER_PASSWORD='<password>' opencode web --hostname 0.0.0.0 --port 4096
            ```

            The app handles HTTP Basic Auth with username `armin` and the password entered on the connection screen.
          files: dist/opencode-android-${{ steps.version.outputs.tag }}.apk
          make_latest: true
